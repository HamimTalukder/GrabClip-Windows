name: Update site stats

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch:             # the "Run workflow" button

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read GoatCounter
        run: python3 tools/fetch-stats.py
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
      - name: Save website/stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/stats.json
          git diff --cached --quiet || (git commit -m "Update site stats" && git push)
